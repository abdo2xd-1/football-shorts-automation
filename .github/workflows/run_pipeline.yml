name: Autonomous Multi-Channel Football Pipeline

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: ['crazy_skills', '90_plus', 'hattrick']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup yt-dlp & EJS Engine
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true
          aria2: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install librosa numpy requests scipy soundfile

      - name: Find Today's Matches Directly
        run: |
          python auto_finder.py "${{ matrix.channel }}"

      - name: Process & Render 90s Multi-Highlight Shorts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python process_video.py

      - name: Upload Generated Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.channel }}-daily-shorts
          path: output_shorts/*.mp4
