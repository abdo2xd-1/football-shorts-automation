name: Daily National Teams Shorts Pipeline

on:
  schedule:
    # يعمل يومياً الساعة 12 منتصف الليل بتوقيت مصر
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-national-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup yt-dlp & Engine
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true
          aria2: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install librosa numpy requests scipy soundfile

      - name: Find Today's International Match
        run: |
          python auto_finder.py

      - name: Process Match & Generate Highlights
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -f target_match.txt ]; then
            MATCH_URL=$(sed -n '1p' target_match.txt)
            MATCH_TITLE=$(sed -n '2p' target_match.txt)
            echo "🔥 جاري مونتاج شورتس لمباراة: $MATCH_TITLE"
            python process_video.py "crazy_skills" "$MATCH_URL" "$MATCH_TITLE"
          else
            echo "ℹ️️ لم يتم العثور على مباريات دولية جديدة منشورة اليوم."
          fi

      - name: Save Shorts Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazy-skills-national-shorts
          path: final_shorts.mp4
