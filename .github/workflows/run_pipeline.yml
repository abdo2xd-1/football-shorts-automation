name: Generate & Publish Shorts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'اختر القناة'
        required: true
        type: choice
        options:
          - '90_plus'
          - 'hattrick'
          - 'crazy_skills'
      match_url:
        description: 'رابط فيديو الماتش على يوتيوب'
        required: true
      caption:
        description: 'عنوان ووصف الفيديو'
        default: 'Insane Football Moments! ⚡⚽'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp librosa numpy requests scipy soundfile

      - name: Prepare YouTube Cookies
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
            echo "✅ تم تجهيز ملف الكوكيز لتخطي الحظر بنجاح!"
          else
            echo "⚠️ تنبيه: لم يتم العثور على YOUTUBE_COOKIES secret"
          fi

      - name: Process Video & Create Shorts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python process_video.py "${{ inputs.channel }}" "${{ inputs.match_url }}" "${{ inputs.caption }}"

      - name: Upload Final Shorts Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.channel }}-final-shorts
          path: final_shorts.mp4
