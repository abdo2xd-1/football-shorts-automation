name: Generate & Publish Shorts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'اختر القناة'
        required: true
        type: choice
        options:
          - '90_plus'
          - 'hattrick'
          - 'crazy_skills'
      match_url:
        description: 'رابط فيديو الماتش على يوتيوب'
        required: true
      caption:
        description: 'عنوان ووصف الفيديو'
        default: 'Insane Football Highlights! 🔥⚽'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # إعداد yt-dlp ومحرك EJS مع تعطيل aria2 لمنع 403
      - name: Setup yt-dlp & EJS Engine
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true
          aria2: false

      # حفظ الكوكيز تلقائياً في مسار yt-dlp
      - name: Configure YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          mkdir -p ~/.config/yt-dlp
          echo "$YOUTUBE_COOKIES" > ~/.config/yt-dlp/cookies.txt
          echo "--cookies ~/.config/yt-dlp/cookies.txt" >> ~/.config/yt-dlp/config
          echo "✅ تم تثبيت الكوكيز بنجاح!"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install librosa numpy requests scipy soundfile

      - name: Process Video & Create Shorts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python process_video.py "${{ inputs.channel }}" "${{ inputs.match_url }}" "${{ inputs.caption }}"

      - name: Upload Final Shorts Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.channel }}-final-shorts
          path: final_shorts.mp4
